<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSI Run Shifts</title>
<meta name="description" content="PIONEER PSI December Run 2026 - Shift Schedule">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1d2330; --muted:#5f6b7a; --line:#d9dee5;
  --accent:#1f3864; --accent-text:#ffffff;
  --owl:#dbe4f6; --owl-strong:#3b5ba5; --day:#fff2cc; --day-strong:#a07800; --eve:#fce4d6; --eve-strong:#b5531c;
  --open:#f8d4d4; --open-text:#9c0006; --hl:#ffe14d; --hl-text:#1d2330; --none:#eceef1;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --panel:#1b2029; --text:#e6e9ee; --muted:#9aa5b4; --line:#2e3542;
    --accent:#8fb0ff; --accent-text:#0f1420;
    --owl:#22304d; --owl-strong:#9db7ff; --day:#3a3216; --day-strong:#f0cf5a; --eve:#3d2619; --eve-strong:#ffab7a;
    --open:#4a1f22; --open-text:#ff9a9a; --hl:#d9b400; --hl-text:#12151b; --none:#232833;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#1b2029; --text:#e6e9ee; --muted:#9aa5b4; --line:#2e3542;
  --accent:#8fb0ff; --accent-text:#0f1420;
  --owl:#22304d; --owl-strong:#9db7ff; --day:#3a3216; --day-strong:#f0cf5a; --eve:#3d2619; --eve-strong:#ffab7a;
  --open:#4a1f22; --open-text:#ff9a9a; --hl:#d9b400; --hl-text:#12151b; --none:#232833;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 0;max-width:1200px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.85rem}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.tabs button{border:0;background:none;color:var(--text);padding:7px 14px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-text)}
.nav{display:inline-flex;gap:6px;align-items:center}
.btn,select,input[type=date]{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit}
.btn{cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
label.who{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.info .panel{padding:12px 14px}
.info h3{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.info .big{font-size:1.05rem;font-weight:600}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:500}
a{color:var(--accent)}
.tbd{color:var(--muted);font-style:italic}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{overflow:hidden}
.card .hd{padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.card .hd span{font-weight:500;font-size:.85rem}
.card ul{list-style:none;margin:0;padding:6px 14px 12px}
.card li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.card li:last-child{border-bottom:0}
.card li .r{color:var(--muted)}
.card li .n{font-weight:600}
.card.none{opacity:.75}
.card.none p{padding:4px 14px 14px;margin:0;color:var(--muted)}
.s-C .hd{background:var(--owl);color:var(--owl-strong)}
.s-A .hd{background:var(--day);color:var(--day-strong)}
.s-B .hd{background:var(--eve);color:var(--eve-strong)}
.open{background:var(--open);color:var(--open-text)!important;font-weight:700;border-radius:4px;padding:0 6px}
.hl{background:var(--hl);color:var(--hl-text)!important;border-radius:4px;padding:0 6px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;font-size:.84rem;width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
.grid thead th{background:var(--accent);color:var(--accent-text);position:sticky;top:0;font-weight:600}
.grid thead th.today{box-shadow:inset 0 -3px 0 var(--hl)}
.grid th.sh{text-align:left;font-weight:700;min-width:80px}
.grid th.ro{text-align:left;font-weight:500;color:var(--muted);min-width:110px}
.grid th.sticky{position:sticky;left:0;z-index:1;background:var(--panel)}
.grid th.sticky2{position:sticky;left:80px;z-index:1;background:var(--panel)}
.grid thead th.sticky,.grid thead th.sticky2{background:var(--accent);z-index:2}
.grid tr.s-C td.f{background:var(--owl)} .grid tr.s-A td.f{background:var(--day)} .grid tr.s-B td.f{background:var(--eve)}
.grid tr.s-C th.sh{color:var(--owl-strong)} .grid tr.s-A th.sh{color:var(--day-strong)} .grid tr.s-B th.sh{color:var(--eve-strong)}
.grid td.x{background:var(--none);color:var(--muted)}
.grid td.out{background:transparent;color:var(--muted)}
.grid tr.first td,.grid tr.first th{border-top:2px solid var(--line)}
.grid tr.meta td{font-size:.78rem;color:var(--muted);white-space:normal;min-width:90px}
.grid td a.d{color:inherit;text-decoration:none}
.grid thead a{color:inherit;text-decoration:none}
.mine{margin-top:14px;padding:12px 14px}
.mine h3{margin:0 0 8px;font-size:1rem}
.mine ol{margin:0;padding-left:20px;columns:2 260px}
.legend{margin-top:12px;color:var(--muted);font-size:.82rem}
footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.8rem}
@media (max-width:600px){h1{font-size:1.1rem}.tabs button{padding:7px 10px}}
@media print{
  .toolbar,footer .noprint{display:none}
  body{background:#fff;color:#000}
  .panel{box-shadow:none}
  .grid thead th{position:static}
}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
</header>
<main>
  <div class="toolbar">
    <div class="tabs" role="tablist">

      <input type="date" id="pick" aria-label="Date">
      <button class="btn" id="next" aria-label="Next">&rarr;</button>
      <button class="btn" id="today">Today</button>
    </div>
    <span class="spacer"></span>
    <label class="who">Highlight
      <select id="who"><option value="">nobody</option></select>
    </label>
  </div>
  <div id="info" class="info"></div>
  <div id="view"></div>
  <div id="mine"></div>
  <div class="legend">Owl on a date = the night starting 00:00 that date (from the evening before). Shifts overlap by 30 min for handover. <span class="open">OPEN</span> = not yet filled.</div>
</main>
<footer><span id="upd"></span></footer>

function dayView(d){
  const day = DAYS[IDX[d]];
  return `<h2 style="margin:4px 0 10px;font-size:1.1rem">${longDate(d)}${d===TODAY?' · today':''}</h2><div class="cards">` +
    DATA.shifts.map(s => {
      const sl = day.slots[s.key];
      if(!sl) return `<div class="panel card none s-${s.key}"><div class="hd">${s.name}<span>${s.time}</span></div><p>No ${s.name} shift this day.</p></div>`;
      return `<div class="panel card s-${s.key}"><div class="hd">${s.name}<span>${s.time}</span></div><ul>` +
        s.roles.map(r => `<li><span class="r">${r.name}</span><span class="n">${name(sl[r.key])}</span></li>`).join('') + '</ul></div>';
    }).join('') + '</div>';
}

function gridTable(dates, opts){
  const head = dates.map(d => {
    const inRun = d in IDX;
    const lbl = fmt(d,{weekday:'short'})+'<br>'+fmt(d,{day:'numeric',month:'short'});
    return `<th class="${d===TODAY?'today':''}">${inRun?`<a href="#day/${d}">${lbl}</a>`:lbl}</th>`;
  }).join('');
  let body = '';
  DATA.shifts.forEach(s => {
    s.roles.forEach((r, k) => {
      body += `<tr class="s-${s.key}${k===0?' first':''}">` +
        (k===0?`<th class="sh sticky" rowspan="${s.roles.length}">${s.name}<div class="sub">${s.time}</div></th>`:'') +
        `<th class="ro sticky2">${r.name}</th>` +
        dates.map(d => {
          if(!(d in IDX)) return '<td class="out"></td>';
          const sl = DAYS[IDX[d]].slots[s.key];
          if(!sl) return '<td class="x">–</td>';
          return `<td class="f">${name(sl[r.key])}</td>`;
        }).join('') + '</tr>';
    });
  });
  if(opts.meta){
    const metaRow = (label, fn, first) => `<tr class="meta${first?' first':''}"><th class="sh sticky" colspan="1">${label}</th><th class="ro sticky2"></th>` +
      dates.map(d => d in IDX ? `<td>${fn(DAYS[IDX[d]])}</td>` : '<td class="out"></td>').join('') + '</tr>';
    body += metaRow('Satellite room', day => day.satellite.rooms.map(esc).join('<br>') || '–', true);
    DATA.oncallKeys.forEach((k, j) => {
      body += metaRow(j===0?'On call':'', day => `${OC_LABEL[k]||k}: ${day.oncall[k]===''?'n/a':name(day.oncall[k])}`, false);
    });
  }
  return `<div class="panel scroll"><table class="grid"><thead><tr><th class="sh sticky"></th><th class="ro sticky2"></th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function weekView(d){
  const m0 = monday(d), dates = [...Array(7)].map((_, i) => add(m0, i));
  return `<h2 style="margin:4px 0 10px;font-size:1.1rem">Week of ${fmt(m0,{day:'numeric',month:'long'})} – ${fmt(dates[6],{day:'numeric',month:'long'})}</h2>` + gridTable(dates, {meta:true});
}

function fullView(){
  const dates = DAYS.map(x => x.date);
  return `<h2 style="margin:4px 0 10px;font-size:1.1rem">Full run · ${fmt(FIRST,{day:'numeric',month:'short'})} – ${fmt(LAST,{day:'numeric',month:'short'})} 2026</h2>` + gridTable(dates, {meta:true});
}

function mine(){
  if(!state.who) return '';
  const rows = [];
  DAYS.forEach(day => DATA.shifts.forEach(s => {
    const sl = day.slots[s.key]; if(!sl) return;
    s.roles.forEach(r => { if(sl[r.key]===state.who) rows.push(`<li><a href="#day/${day.date}">${fmt(day.date,{weekday:'short',day:'numeric',month:'short'})}</a> · ${s.name} (${s.time}) · ${r.name}</li>`); });
  }));
  const oc = [];
  DAYS.forEach(day => DATA.oncallKeys.forEach(k => { if(day.oncall[k]===state.who) oc.push([day.date, k]); }));
  const ocTxt = summarizeOncall(oc);
  return `<div class="panel mine"><h3>${esc(state.who)}: ${rows.length} shift${rows.length===1?'':'s'}</h3>` +
    (rows.length?`<ol>${rows.join('')}</ol>`:'<div class="sub">No control-room shifts.</div>') +
    (ocTxt?`<div class="sub" style="margin-top:8px">On call: ${ocTxt}</div>`:'') + '</div>';
}
function summarizeOncall(list){
  const by = {};
  list.forEach(([d,k]) => (by[k] = by[k] || []).push(d));
  return Object.entries(by).map(([k, ds]) => {
    const parts = []; let a = ds[0], b = ds[0];
    for(let i=1;i<=ds.length;i++){ if(i<ds.length && ds[i]===add(b,1)){ b=ds[i]; continue; }
      parts.push(a===b?fmt(a,{day:'numeric',month:'short'}):`${fmt(a,{day:'numeric',month:'short'})}–${fmt(b,{day:'numeric',month:'short'})}`);
      if(i<ds.length){a=b=ds[i];} }
    return `${OC_LABEL[k]||k} ${parts.join(', ')}`;
  }).join('; ');
}

function render(){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view===state.view));
  $('#nav').style.display = state.view==='full' ? 'none' : '';
  $('#pick').value = state.date;
  const step = state.view==='week' ? 7 : 1;
  $('#prev').disabled = state.view==='week' ? monday(state.date) <= FIRST : state.date <= FIRST;
  $('#next').disabled = state.view==='week' ? add(monday(state.date),6) >= LAST : state.date >= LAST;
  $('#info').innerHTML = info(state.view==='full' ? clamp(TODAY) : state.date);
  $('#view').innerHTML = state.view==='day' ? dayView(state.date) : state.view==='week' ? weekView(state.date) : fullView();
  $('#mine').innerHTML = mine();
  const h = `#${state.view}${state.view==='full'?'':'/'+state.date}`;
  if(location.hash !== h) history.replaceState(null, '', h);
}
function fromHash(){
  const m = location.hash.match(/^#(day|week|full)(?:\/(\d{4}-\d{2}-\d{2}))?/);
  if(m){ state.view = m[1]; if(m[2]) state.date = clamp(m[2]); }
}

$('#title').textContent = DATA.title;
$('#sub').textContent = `Run ${fmt(FIRST,{day:'numeric',month:'short'})} – ${fmt(LAST,{day:'numeric',month:'short'})} 2026 · Owl ${SHIFT.C.time} · Day ${SHIFT.A.time} · Evening ${SHIFT.B.time}`;
$('#upd').textContent = `Last updated ${DATA.updated}`;
const sel = $('#who');
DATA.people.forEach(p => { const o = document.createElement('option'); o.value = o.textContent = p; sel.appendChild(o); });
if(!DATA.people.includes(state.who)) state.who = '';
sel.value = state.who;
sel.onchange = () => { state.who = sel.value; store.set('who', state.who); render(); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); });
$('#prev').onclick = () => { state.date = clamp(add(state.date, state.view==='week'?-7:-1)); render(); };
$('#next').onclick = () => { state.date = clamp(add(state.date, state.view==='week'?7:1)); render(); };
$('#today').onclick = () => { state.date = clamp(TODAY); render(); };
$('#pick').min = FIRST; $('#pick').max = LAST;
$('#pick').onchange = e => { if(e.target.value){ state.date = clamp(e.target.value); render(); } };
window.addEventListener('hashchange', () => { fromHash(); render(); });
fromHash(); render();
</script>
</body>
</html>
